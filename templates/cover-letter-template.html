<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{NAME}} — Cover Letter</title>
<style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('./fonts/space-grotesk-latin.woff2') format('woff2');
    font-weight: 300 700;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  @font-face {
    font-family: 'Space Grotesk';
    src: url('./fonts/space-grotesk-latin-ext.woff2') format('woff2');
    font-weight: 300 700;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  @font-face {
    font-family: 'DM Sans';
    src: url('./fonts/dm-sans-latin.woff2') format('woff2');
    font-weight: 100 1000;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  @font-face {
    font-family: 'DM Sans';
    src: url('./fonts/dm-sans-latin-ext.woff2') format('woff2');
    font-weight: 100 1000;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    font-size: 11.5px;
    line-height: 1.6;
    color: #1a1a2e;
    background: #ffffff;
    padding: 0;
    margin: 0;
  }

  .page {
    width: 100%;
    max-width: {{PAGE_WIDTH}};
    margin: 0 auto;
    padding: 40px 50px;
  }

  /* === HEADER === */
  .header {
    margin-bottom: 30px;
    border-bottom: 1px solid #e5e7eb;
    padding-bottom: 15px;
  }

  .header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: #1a1a2e;
    letter-spacing: -0.02em;
    margin-bottom: 2px;
    line-height: 1.1;
  }

  .contact-info {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    line-height: 1.5;
    color: #4b5563;
    margin-top: 6px;
  }

  .contact-info div {
    margin-bottom: 2px;
  }

  .contact-info a {
    color: #4b5563;
    text-decoration: none;
  }

  .contact-info a:hover {
    text-decoration: underline;
  }

  .separator {
    margin: 0 6px;
    color: #9ca3af;
  }

  /* === LETTER DETAILS === */
  .letter-meta {
    margin-bottom: 25px;
    color: #1a1a2e;
  }

  .date {
    font-weight: 500;
    margin-bottom: 20px;
  }

  .recipient {
    white-space: pre-line;
    margin-bottom: 20px;
    line-height: 1.5;
  }

  .subject {
    font-weight: 700;
    margin-bottom: 25px;
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: #111827;
  }

  /* === LETTER BODY === */
  .letter-content {
    color: #1f2937;
    margin-bottom: 35px;
  }

  .letter-content p {
    margin-bottom: 15px;
    text-align: justify;
  }

  .salutation {
    margin-bottom: 15px;
    font-weight: 500;
  }

  .signoff {
    white-space: pre-line;
    margin-top: 25px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <div class="header">
    <h1>{{NAME}}</h1>
    <div class="contact-info">
      <div>
        <span class="role-span"><span>{{TARGET_ROLE}}</span><span class="separator">·</span></span>
        <span>{{LOCATION}}</span>
        <span class="separator">·</span>
        <a class="email-link" href="mailto:{{EMAIL}}">{{EMAIL}}</a>
        <span class="phone-span"><span class="separator">|</span><span>{{PHONE}}</span></span>
      </div>
      <div>
        <span class="linkedin-span"><a href="{{LINKEDIN_URL}}">{{LINKEDIN_DISPLAY}}</a></span>
        <span class="github-span"><span class="separator">|</span><a href="{{GITHUB_URL}}">{{GITHUB_DISPLAY}}</a></span>
        <span class="portfolio-span"><span class="separator">|</span><a href="{{PORTFOLIO_URL}}">{{PORTFOLIO_DISPLAY}}</a></span>
      </div>
    </div>
  </div>

  <!-- LETTER DETAILS -->
  <div class="letter-meta">
    <div class="date">{{DATE}}</div>
    <div class="recipient">{{RECIPIENT}}</div>
    <div class="subject">{{SUBJECT}}</div>
  </div>

  <!-- LETTER BODY -->
  <div class="letter-content">
    <div class="salutation">{{SALUTATION}}</div>
    {{BODY}}
    <div class="signoff">{{SIGNOFF}}</div>
  </div>

</div>
</body>
</html>
